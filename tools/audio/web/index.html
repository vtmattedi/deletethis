<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INMP441 Live</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>INMP441 detector</h1>
  <span id="link" class="pill">connecting</span>
</header>

<main>
  <section class="card state">
    <div id="state" class="state-name">--</div>
    <dl>
      <dt>candidate</dt><dd id="candidate">--</dd>
      <dt>stable</dt><dd id="stable">--</dd>
    </dl>
  </section>

  <section class="card">
    <h2>Features</h2>
    <table id="features"><tbody></tbody></table>
  </section>

  <section class="card">
    <h2>Stream</h2>
    <table id="stream"><tbody></tbody></table>
  </section>

  <section class="card">
    <h2>Settings</h2>
    <form id="settings"></form>
    <p id="saved" class="note"></p>
  </section>

  <section class="card wide">
    <div class="head">
      <h2>History</h2>
      <select id="range">
        <option value="300">last 5 min</option>
        <option value="900" selected>last 15 min</option>
        <option value="3600">last hour</option>
        <option value="21600">last 6 hours</option>
        <option value="86400">last day</option>
      </select>
      <span id="historyNote" class="note"></span>
    </div>
    <div id="historyLegend" class="legend"></div>
    <div id="historyChart" class="chart"></div>
  </section>

  <section class="card wide">
    <h2>Events</h2>
    <p class="note">
      Written on a published state change: 15 s before and after,
      raw PCM, with the decision that caused it.
    </p>
    <ul id="events"></ul>
  </section>

  <section class="card wide" id="detail" hidden>
    <div class="head">
      <h2>Event detail</h2>
      <button id="closeDetail" type="button">close</button>
    </div>
    <div id="detailBody"></div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
