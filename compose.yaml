services:
  audio-backend:
    build:
      context: .
      dockerfile: tools/audio/Dockerfile
    command:
      - --target
      - ${AUDIO_TARGET:-10.10.3.17:3333}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    # Credentials (MQTT_*) are read at run time and are not in the image
    # (see .dockerignore). Later files win.
    env_file:
      - path: .env
        required: false
      - path: tools/audio/backend/.env
        required: false
    environment:
      TZ: ${AUDIO_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "${AUDIO_HTTP_PORT:-8000}:8000"
    volumes:
      # Bind the existing directory so native and container runs use the
      # same DB, configuration, event metadata, and WAV recordings.
      - type: bind
        source: ./tools/audio/results
        target: /app/tools/audio/results
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=2)
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
